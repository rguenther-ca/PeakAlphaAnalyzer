workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60

    environment:
      java: 17
      vars:
        ANDROID_SDK_ROOT: /opt/android-sdk

    scripts:
      - name: Install Android command-line tools
        script: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools

          # Download Google's command-line tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip

          # Extract
          unzip tools.zip

          # Google sometimes nests the folder as cmdline-tools/cmdline-tools
          if [ -d "cmdline-tools/bin" ]; then
            mv cmdline-tools latest
          elif [ -d "cmdline-tools/cmdline-tools/bin" ]; then
            mv cmdline-tools/cmdline-tools latest
          else
            echo "Could not find extracted cmdline-tools folder"
            exit 1
          fi

          # Verify sdkmanager exists
          if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager not found after extraction"
            exit 1
          fi

      - name: Accept Android licenses
        script: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK components
        script: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools"

      - name: Make Gradle executable
        script: chmod +x ./gradlew

      - name: Build debug APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - codemagic-build-android-apk@guenthers.ca
